<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShieldID identity and document screening">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShieldID">
  <link rel="apple-touch-icon" href="icons/shieldid-icon.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>ShieldID</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fast Web QR & Barcode Decoder (jsQR) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <!-- Tesseract.js for Real-Time On-Device Web OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // 1. Intercept getUserMedia to store the exact active Camera MediaStream
    window.__activeCameraStreams = [];
    if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
      const origGUM = navigator.mediaDevices.getUserMedia.bind(navigator.mediaDevices);
      navigator.mediaDevices.getUserMedia = async function(constraints) {
        const stream = await origGUM(constraints);
        if (stream) {
          window.__activeCameraStreams.push(stream);
        }
        return stream;
      };
    }

    // 2. High-Reliability Flashlight / Torch Toggle for Chrome on Android / iOS
    window.toggleWebTorch = async function(enable) {
      const boolEnable = !!enable;
      let applied = false;

      // A. Try stored active media streams
      if (window.__activeCameraStreams && window.__activeCameraStreams.length > 0) {
        for (let stream of window.__activeCameraStreams) {
          try {
            const tracks = stream.getVideoTracks();
            for (let t of tracks) {
              if (t.readyState === 'live') {
                await t.applyConstraints({
                  advanced: [{ torch: boolEnable }]
                });
                applied = true;
              }
            }
          } catch (e) {
            console.warn('Torch error on active stream:', e);
          }
        }
      }

      // B. Recursive Shadow DOM video elements crawler
      function findVideoElements(root = document) {
        let results = Array.from(root.querySelectorAll('video'));
        const allEls = root.querySelectorAll('*');
        for (let el of allEls) {
          if (el.shadowRoot) {
            results = results.concat(findVideoElements(el.shadowRoot));
          }
        }
        return results;
      }

      const videos = findVideoElements();
      for (let v of videos) {
        if (v && v.srcObject && typeof v.srcObject.getVideoTracks === 'function') {
          const tracks = v.srcObject.getVideoTracks();
          for (let t of tracks) {
            try {
              await t.applyConstraints({
                advanced: [{ torch: boolEnable }]
              });
              applied = true;
            } catch (err) {
              console.warn('Torch error on video element:', err);
            }
          }
        }
      }

      return applied;
    };

    // Fast multi-pass QR helper with contrast inversion
    function scanCanvasForQR(canvas) {
      if (!window.jsQR || !canvas) return '';
      try {
        const ctx = canvas.getContext('2d');
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        
        // Pass A: Normal
        let res = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: 'attemptBoth'
        });
        if (res && res.data) return res.data;

        // Pass B: Inverted
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          d[i] = 255 - d[i];
          d[i+1] = 255 - d[i+1];
          d[i+2] = 255 - d[i+2];
        }
        res = jsQR(d, imgData.width, imgData.height, {
          inversionAttempts: 'dontInvert'
        });
        if (res && res.data) return res.data;
      } catch (e) {}
      return '';
    }

    // Adaptive contrast stretch & edge enhancement (preserves thin name characters on textured backgrounds)
    function preprocessCanvasForBlur(ctx, width, height) {
      try {
        const imgData = ctx.getImageData(0, 0, width, height);
        const d = imgData.data;
        let min = 255, max = 0;

        // Calculate luminance histogram limits
        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          if (lum < min) min = lum;
          if (lum > max) max = lum;
        }

        const range = Math.max(1, max - min);

        for (let i = 0; i < d.length; i += 4) {
          const lum = 0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2];
          // Standard linear contrast normalization (0..255)
          const stretched = Math.min(255, Math.max(0, ((lum - min) / range) * 255));
          d[i] = stretched;
          d[i+1] = stretched;
          d[i+2] = stretched;
        }
        ctx.putImageData(imgData, 0, 0);
      } catch (e) {}
    }

    // ── Persistent Tesseract Worker (initialised once, reused for speed) ──────
    let _tessWorker = null;
    let _tessWorkerReady = false;
    let _tessWorkerInit = null;

    async function getTessWorker() {
      if (_tessWorker && _tessWorkerReady) return _tessWorker;
      if (_tessWorkerInit) return _tessWorkerInit;

      _tessWorkerInit = (async () => {
        try {
          const w = await Tesseract.createWorker('eng', 1, {
            logger: () => {}
          });
          _tessWorker = w;
          _tessWorkerReady = true;
          return w;
        } catch (e) {
          console.warn('Tesseract worker init failed, will use recognize() fallback:', e);
          _tessWorkerInit = null;
          return null;
        }
      })();
      return _tessWorkerInit;
    }

    // Kick off worker init immediately so it's warm by the time user captures
    if (window.Tesseract) {
      getTessWorker().catch(() => {});
    }

    // Down-scale canvas to maxDim on its longer side (speeds OCR by 60-70%)
    function scaleCanvas(srcCanvas, maxDim) {
      const w = srcCanvas.width, h = srcCanvas.height;
      if (w <= maxDim && h <= maxDim) return srcCanvas;
      const scale = maxDim / Math.max(w, h);
      const c = document.createElement('canvas');
      c.width = Math.round(w * scale);
      c.height = Math.round(h * scale);
      c.getContext('2d').drawImage(srcCanvas, 0, 0, c.width, c.height);
      return c;
    }

    // Run OCR with the persistent worker, 8 s timeout
    async function runOCR(canvas) {
      const small = scaleCanvas(canvas, 1024);
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('OCR_TIMEOUT')), 8000));
      try {
        const worker = await getTessWorker();
        if (worker) {
          const result = await Promise.race([worker.recognize(small), timeout]);
          return result?.data?.text || '';
        }
      } catch (e) {
        if (e.message !== 'OCR_TIMEOUT') console.warn('Worker OCR error:', e);
      }
      // Fallback: stateless recognize
      try {
        const small2 = scaleCanvas(canvas, 800);
        const result2 = await Promise.race([
          Tesseract.recognize(small2, 'eng'),
          new Promise((_, rej) => setTimeout(() => rej(new Error('t')), 7000))
        ]);
        return result2?.data?.text || '';
      } catch (_) {}
      return '';
    }

    // Client-side Browser QR & OCR Scanner on captured document photo
    window.performWebOCR = async function(imageDataUrl) {
      let qrText = '';
      let ocrText = '';

      try {
        const img = new Image();
        const loadPromise = new Promise((resolve, reject) => {
          img.onload = () => resolve();
          img.onerror = (e) => reject(e);
          img.src = imageDataUrl;
        });
        await loadPromise;

        const width = img.naturalWidth || img.width || 1280;
        const height = img.naturalHeight || img.height || 720;

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // 1. Hardware-accelerated BarcodeDetector (Chrome Android)
        if ('BarcodeDetector' in window) {
          try {
            const detector = new BarcodeDetector({
              formats: ['qr_code', 'data_matrix', 'code_128', 'pdf417']
            });
            const barcodes = await detector.detect(canvas);
            if (barcodes && barcodes.length > 0) {
              qrText = barcodes[0].rawValue || '';
            }
          } catch (err) {}
        }

        // 2. Multi-Zone jsQR Scanning (Full frame, right crop, center box)
        if (!qrText) qrText = scanCanvasForQR(canvas);

        if (!qrText && width > 250 && height > 250) {
          const rightCanvas = document.createElement('canvas');
          rightCanvas.width = Math.floor(width * 0.55);
          rightCanvas.height = height;
          const rCtx = rightCanvas.getContext('2d');
          rCtx.drawImage(img, Math.floor(width * 0.45), 0, rightCanvas.width, height, 0, 0, rightCanvas.width, height);
          qrText = scanCanvasForQR(rightCanvas);
        }

        if (!qrText && width > 250 && height > 250) {
          const centerCanvas = document.createElement('canvas');
          centerCanvas.width = Math.floor(width * 0.75);
          centerCanvas.height = Math.floor(height * 0.75);
          const cCtx = centerCanvas.getContext('2d');
          cCtx.drawImage(img, Math.floor(width * 0.12), Math.floor(height * 0.12), centerCanvas.width, centerCanvas.height, 0, 0, centerCanvas.width, centerCanvas.height);
          qrText = scanCanvasForQR(centerCanvas);
        }

        // 3. Enhanced Preprocessing + Persistent-Worker OCR (fast path)
        const enhancedCanvas = document.createElement('canvas');
        enhancedCanvas.width = width;
        enhancedCanvas.height = height;
        const eCtx = enhancedCanvas.getContext('2d');
        eCtx.drawImage(img, 0, 0, width, height);
        preprocessCanvasForBlur(eCtx, width, height);

        if (window.Tesseract) {
          ocrText = await runOCR(enhancedCanvas);

          // Card Viewport Crop (contains the full card width, removes background clutter above/below)
          if (height > 250) {
            const cardCanvas = document.createElement('canvas');
            const cy = Math.floor(height * 0.20);
            const ch = Math.floor(height * 0.60);
            cardCanvas.width = width;
            cardCanvas.height = ch;
            const cCtx = cardCanvas.getContext('2d');
            cCtx.drawImage(img, 0, cy, width, ch, 0, 0, width, ch);
            preprocessCanvasForBlur(cCtx, width, ch);

            if (!qrText) qrText = scanCanvasForQR(cardCanvas);

            const extra = await runOCR(cardCanvas);
            if (extra) ocrText = (ocrText ? ocrText + '\n' : '') + extra;
          }
        }
      } catch (err) {
        console.error('performWebOCR general error:', err);
      }

      return JSON.stringify({ qr: qrText, ocr: ocrText });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
