<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShieldID identity and document screening">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShieldID">
  <link rel="apple-touch-icon" href="icons/shieldid-icon.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>ShieldID</title>
  <link rel="manifest" href="manifest.json">

  <!-- Fast Web QR & Barcode Decoder (jsQR) -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <!-- Tesseract.js for Real-Time On-Device Web OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // Browser Flashlight / Torch Toggle for Chrome on Android / iOS
    window.toggleWebTorch = async function(enable) {
      try {
        const videos = document.querySelectorAll('video');
        for (let v of videos) {
          if (v && v.srcObject) {
            const tracks = v.srcObject.getVideoTracks();
            for (let t of tracks) {
              try {
                await t.applyConstraints({
                  advanced: [{ torch: !!enable }]
                });
                return true;
              } catch (err) {
                console.warn('Torch constraint error on track:', err);
              }
            }
          }
        }
      } catch (e) {
        console.warn('Web Torch error:', e);
      }
      return false;
    };

    // Fast helper to scan QR code on a canvas region
    function scanCanvasForQR(canvas) {
      if (window.jsQR) {
        try {
          const ctx = canvas.getContext('2d');
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const res = jsQR(imgData.data, imgData.width, imgData.height, {
            inversionAttempts: 'attemptBoth'
          });
          if (res && res.data) return res.data;
        } catch (e) {}
      }
      return '';
    }

    // Client-side Browser QR & OCR Scanner on captured document photo
    window.performWebOCR = async function(imageDataUrl) {
      let qrText = '';
      let ocrText = '';

      try {
        // 1. Load captured image onto canvas
        const img = new Image();
        const loadPromise = new Promise((resolve, reject) => {
          img.onload = () => resolve();
          img.onerror = (e) => reject(e);
          img.src = imageDataUrl;
        });
        await loadPromise;

        const width = img.naturalWidth || img.width || 1280;
        const height = img.naturalHeight || img.height || 720;

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // A. BarcodeDetector check (Hardware accelerated in Chrome Android)
        if ('BarcodeDetector' in window) {
          try {
            const detector = new BarcodeDetector({
              formats: ['qr_code', 'data_matrix', 'code_128', 'pdf417']
            });
            const barcodes = await detector.detect(canvas);
            if (barcodes && barcodes.length > 0) {
              qrText = barcodes[0].rawValue || '';
            }
          } catch (err) {}
        }

        // B. Multi-region jsQR scanning (Full frame, center box, right side)
        if (!qrText) {
          qrText = scanCanvasForQR(canvas);
        }

        if (!qrText && width > 300 && height > 300) {
          // Check center crop (inside guideline box)
          const centerCanvas = document.createElement('canvas');
          centerCanvas.width = Math.floor(width * 0.7);
          centerCanvas.height = Math.floor(height * 0.7);
          const cCtx = centerCanvas.getContext('2d');
          cCtx.drawImage(img, Math.floor(width * 0.15), Math.floor(height * 0.15), centerCanvas.width, centerCanvas.height, 0, 0, centerCanvas.width, centerCanvas.height);
          qrText = scanCanvasForQR(centerCanvas);
        }

        if (!qrText && width > 300 && height > 300) {
          // Check right-half crop (where Indian PAN QR codes are located)
          const rightCanvas = document.createElement('canvas');
          rightCanvas.width = Math.floor(width * 0.5);
          rightCanvas.height = height;
          const rCtx = rightCanvas.getContext('2d');
          rCtx.drawImage(img, Math.floor(width * 0.5), 0, rightCanvas.width, height, 0, 0, rightCanvas.width, height);
          qrText = scanCanvasForQR(rightCanvas);
        }

        // C. Tesseract.js High-Performance OCR
        if (window.Tesseract) {
          try {
            const ret = await Tesseract.recognize(canvas, 'eng');
            ocrText = ret?.data?.text || '';
          } catch (e) {
            console.warn('Tesseract OCR recognize error:', e);
          }
        }
      } catch (err) {
        console.error('performWebOCR general error:', err);
      }

      return JSON.stringify({
        qr: qrText,
        ocr: ocrText
      });
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
