<!DOCTYPE html>
<html>
<head>
  <base href="/mobile/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ShieldID identity and document screening">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ShieldID">
  <link rel="apple-touch-icon" href="icons/shieldid-icon.svg">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>ShieldID</title>
  <link rel="manifest" href="manifest.json">

  <!-- Tesseract.js for Real-Time On-Device Web OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <script>
    // Browser Flashlight / Torch Toggle for Chrome on Android / iOS
    window.toggleWebTorch = async function(enable) {
      try {
        const videos = document.querySelectorAll('video');
        for (let v of videos) {
          if (v && v.srcObject) {
            const tracks = v.srcObject.getVideoTracks();
            for (let t of tracks) {
              try {
                await t.applyConstraints({
                  advanced: [{ torch: !!enable }]
                });
                return true;
              } catch (err) {
                console.warn('Torch constraint error on track:', err);
              }
            }
          }
        }
      } catch (e) {
        console.warn('Web Torch error:', e);
      }
      return false;
    };

    // Client-side Browser OCR on captured document photo
    window.performWebOCR = async function(imageDataUrl) {
      try {
        if (window.Tesseract) {
          const worker = await Tesseract.createWorker('eng');
          const ret = await worker.recognize(imageDataUrl);
          await worker.terminate();
          return ret.data.text || '';
        }
      } catch (e) {
        console.error('Web Tesseract OCR failed:', e);
      }
      return '';
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
